<!DOCTYPE html>
<html>
<head>
    <title>Game Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; text-align: center; padding-top: 50px; }
        .game-card { background: #333; display: inline-block; padding: 20px; margin: 15px; border-radius: 8px; width: 150px; }
        a.play-btn { display: inline-block; margin-top: 10px; padding: 8px 15px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; }
        .logout-btn { color: #ff4d4d; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Welcome, {{ user.username }}!</h1>
    <p><a href="{% url 'logout' %}" class="logout-btn">Logout</a></p>
    
    <h2>Select a Game</h2>
    <div class="game-card">
        <h3>Snake</h3>
        <a href="/game/snake/" class="play-btn">Play Snake</a>
    </div>
    <div class="game-card">
        <h3>Tetris</h3>
        <a href="/game/tetris/" class="play-btn">Play Tetris</a>
    </div>
</body>
</html>
